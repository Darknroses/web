name: Sync fork with upstream

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository to sync from'
        required: true
        default: 'OCA/web'
  schedule:
    - cron: '0 3 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PAT_TOKEN: ${{ secrets.Fork_Sync_Automation }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/${{ github.event.inputs.upstream_repo }}.git || true
          git fetch upstream --prune '+refs/heads/*:refs/remotes/upstream/*'

      - name: Sync all branches
        run: |
          for branch in $(git for-each-ref --format='%(refname:short)' refs/remotes/upstream/ | grep -E '^upstream/' | sed 's|^upstream/||'); do
            echo "Processing branch: $branch"

            if git show-ref --verify --quiet refs/heads/$branch; then
              git checkout $branch
              git merge --ff-only upstream/$branch || true
            else
              git checkout -B $branch upstream/$branch
            fi

            git push https://$PAT_TOKEN@github.com/${{ github.repository }}.git $branch --set-upstream --force-with-lease
          done

      - name: Push changes
        env:
          PAT_TOKEN: ${{ secrets.Fork_Sync_Automation }}
        run: |
          for branch in $(git branch | sed 's/\* //'); do
            echo "Pushing branch $branch"
            git push https://$PAT_TOKEN@github.com/Darknroses/web.git $branch --set-upstream --force-with-lease
          done
