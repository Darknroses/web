name: Sync fork with upstream

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository to sync from'
        required: true
        default: 'OCA/web'
  schedule:
    - cron: '0 3 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        env:
          PAT_TOKEN: ${{ secrets.Fork_Sync_Automation }}
        with:
          fetch-depth: 0
          # If the PAT is missing, this will now show a clearer error or fallback
          token: ${{ secrets.Fork_Sync_Automation || github.token }}


      - name: Set Upstream Variable
        run: |
          # If triggered by dispatch, use input. If by schedule, use default.
          UPSTREAM_REPO="${{ github.event.inputs.upstream_repo }}"
          echo "UPSTREAM_REPO=$UPSTREAM_REPO" >> $GITHUB_ENV

      - name: Sync all branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream --prune '+refs/heads/*:refs/remotes/upstream/*'
          
          SKIP_BRANCHES="11.0 12.0 13.0 14.0 15.0 16.0 17.0 18.0"
          FAILED_BRANCHES=""
          
          for branch in $(git for-each-ref --format='%(refname:short)' refs/remotes/upstream/ | sed 's|^upstream/||'); do
            if echo "$SKIP_BRANCHES" | grep -wq "$branch"; then
              echo ">>> Skipping old branch: $branch"
              continue
            fi
          
            echo ">>> Syncing branch: $branch"
            git checkout -B "$branch" "upstream/$branch"
          
            # Push and capture failure if it happens
            if ! git push origin "$branch" --force-with-lease; then
              echo "::error:: Failed to push $branch"
              FAILED_BRANCHES="$FAILED_BRANCHES $branch"
            fi
          done
          
          # If any branch failed, make the job fail at the very end
          if [ -n "$FAILED_BRANCHES" ]; then
            echo "The following branches failed to sync: $FAILED_BRANCHES"
            exit 1
          fi